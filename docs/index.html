<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>3D Solar System Explorer</title>

    <style>
        /* Remove default browser spacing */
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;

            background: #02030a;
            color: white;

            font-family: Arial, sans-serif;
        }

        /*
         * Three.js creates a <canvas>.
         * Our entire 3D solar system is rendered inside it.
         */
        canvas {
            display: block;
        }

        /* Information panel */
        #panel {
            position: fixed;

            top: 20px;
            left: 20px;

            width: 330px;

            padding: 18px;

            background: rgba(5, 15, 35, 0.85);

            border: 1px solid #31527a;
            border-radius: 15px;

            z-index: 10;
        }

        #panel h1 {
            margin: 0 0 10px 0;

            font-size: 22px;

            color: #7ec8ff;
        }

        #panel p {
            margin: 5px 0;

            font-size: 13px;

            color: #c5d4e8;
        }

        /* Planet buttons */
        #planet-buttons {
            display: flex;
            flex-wrap: wrap;

            gap: 7px;

            margin-top: 15px;
        }

        button {
            padding: 7px 11px;

            border: 1px solid #517aad;
            border-radius: 20px;

            background: #102541;
            color: white;

            cursor: pointer;
        }

        button:hover {
            background: #1c4b7e;
        }

        /* Planet information */
        #planet-info {
            position: fixed;

            right: 20px;
            top: 20px;

            min-width: 200px;

            padding: 15px;

            background: rgba(5, 15, 35, 0.9);

            border: 1px solid #31527a;
            border-radius: 15px;

            display: none;

            z-index: 10;
        }

        #planet-info h2 {
            color: #7ec8ff;

            margin-top: 0;
        }
    </style>
</head>

<body>

    <!-- Interface -->
    <div id="panel">

        <h1>☀️ Solar System Explorer</h1>

        <p>🖱️ Left drag → Rotate camera</p>
        <p>🔎 Mouse wheel → Zoom</p>
        <p>🖱️ Right drag → Move camera</p>
        <p>🪐 Click a planet → Visit planet</p>

        <div id="planet-buttons"></div>

    </div>


    <!-- Information appears when a planet is selected -->
    <div id="planet-info"></div>


    <!--
        Import Three.js.

        "three" = main Three.js library

        "three/addons/" = extra Three.js functionality
        such as OrbitControls.
    -->
    <script type="importmap">

    {
        "imports": {
            "three":
            "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

            "three/addons/":
            "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
    }

    </script>


    <script type="module">

        /*
         * =====================================================
         * 1. IMPORT THREE.JS
         * =====================================================
         */

        import * as THREE from "three";

        import {
            OrbitControls
        } from "three/addons/controls/OrbitControls.js";


        /*
         * =====================================================
         * 2. CREATE THE 3D WORLD
         * =====================================================
         *
         * A Three.js application normally needs:
         *
         * Scene
         * Camera
         * Renderer
         *
         * Think:
         *
         * Scene    = our universe
         * Camera   = user's eyes
         * Renderer = draws what the eyes see
         */


        const scene = new THREE.Scene();


        /*
         * Create camera
         */

        const camera =
            new THREE.PerspectiveCamera(

                55,

                window.innerWidth /
                window.innerHeight,

                0.1,

                3000
            );


        /*
         * Starting position of the user.
         */

        camera.position.set(
            0,
            60,
            120
        );


        /*
         * Create renderer.
         *
         * WebGLRenderer uses the computer's graphics
         * capabilities to draw the 3D scene.
         */

        const renderer =
            new THREE.WebGLRenderer({
                antialias: true
            });


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );


        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio,
                2
            )
        );


        /*
         * Add the generated canvas to our HTML page.
         */

        document.body.appendChild(
            renderer.domElement
        );


        /*
         * =====================================================
         * 3. CAMERA CONTROLS
         * =====================================================
         */


        const controls =
            new OrbitControls(
                camera,
                renderer.domElement
            );


        /*
         * Makes camera movement smoother.
         */

        controls.enableDamping = true;

        controls.dampingFactor = 0.05;


        /*
         * Limit how far the user can zoom.
         */

        controls.minDistance = 5;

        controls.maxDistance = 350;



        /*
         * =====================================================
         * 4. CREATE SPACE / STARS
         * =====================================================
         */


        const starPositions = [];


        /*
         * Create many randomly positioned stars.
         */

        for (let i = 0; i < 5000; i++) {

            const distance =
                400 +
                Math.random() * 800;


            const theta =
                Math.random() *
                Math.PI * 2;


            const phi =
                Math.acos(
                    2 * Math.random() - 1
                );


            const x =
                distance *
                Math.sin(phi) *
                Math.cos(theta);


            const y =
                distance *
                Math.cos(phi);


            const z =
                distance *
                Math.sin(phi) *
                Math.sin(theta);


            starPositions.push(
                x,
                y,
                z
            );
        }


        /*
         * Geometry stores star positions.
         */

        const starGeometry =
            new THREE.BufferGeometry();


        starGeometry.setAttribute(

            "position",

            new THREE.Float32BufferAttribute(
                starPositions,
                3
            )

        );


        /*
         * Define what the stars look like.
         */

        const starMaterial =
            new THREE.PointsMaterial({

                color: 0xffffff,

                size: 0.8

            });


        const stars =
            new THREE.Points(
                starGeometry,
                starMaterial
            );


        scene.add(stars);



        /*
         * =====================================================
         * 5. LIGHT
         * =====================================================
         */


        /*
         * Small amount of light everywhere.
         */

        const ambientLight =
            new THREE.AmbientLight(
                0x28364c,
                0.6
            );


        scene.add(
            ambientLight
        );


        /*
         * =====================================================
         * 6. CREATE SUN
         * =====================================================
         */


        /*
         * SphereGeometry creates a sphere.
         */

        const sunGeometry =
            new THREE.SphereGeometry(
                7,
                48,
                48
            );


        /*
         * Material controls the appearance.
         */

        const sunMaterial =
            new THREE.MeshBasicMaterial({

                color: 0xffb21c

            });


        /*
         * Mesh =
         *
         * geometry + material
         */

        const sun =
            new THREE.Mesh(
                sunGeometry,
                sunMaterial
            );


        scene.add(
            sun
        );


        /*
         * Sun acts as our light source.
         */

        const sunLight =
            new THREE.PointLight(
                0xffffff,
                900,
                700
            );


        scene.add(
            sunLight
        );



        /*
         * =====================================================
         * 7. PLANET DATA
         * =====================================================
         *
         * Each planet has:
         *
         * name
         * size
         * distance from Sun
         * color
         * movement speed
         */


        const planetData = [

            {
                name: "Mercury",
                size: 0.8,
                distance: 12,
                color: 0xaaaaaa,
                speed: 4.15
            },

            {
                name: "Venus",
                size: 1.3,
                distance: 18,
                color: 0xd9a05b,
                speed: 1.62
            },

            {
                name: "Earth",
                size: 1.4,
                distance: 25,
                color: 0x2874d8,
                speed: 1
            },

            {
                name: "Mars",
                size: 1.0,
                distance: 32,
                color: 0xc85b35,
                speed: 0.53
            },

            {
                name: "Jupiter",
                size: 3.7,
                distance: 44,
                color: 0xcfa47e,
                speed: 0.084
            },

            {
                name: "Saturn",
                size: 3.1,
                distance: 57,
                color: 0xdac58d,
                speed: 0.034
            },

            {
                name: "Uranus",
                size: 2.2,
                distance: 69,
                color: 0x80dce5,
                speed: 0.012
            },

            {
                name: "Neptune",
                size: 2.2,
                distance: 80,
                color: 0x3158d4,
                speed: 0.006
            }

        ];



        /*
         * Store all planets here.
         */

        const planets = [];



        /*
         * =====================================================
         * 8. CREATE ORBIT LINES
         * =====================================================
         */


        function createOrbit(distance) {

            const points = [];


            for (let i = 0; i <= 128; i++) {

                const angle =
                    (i / 128) *
                    Math.PI * 2;


                points.push(

                    new THREE.Vector3(

                        Math.cos(angle)
                        * distance,

                        0,

                        Math.sin(angle)
                        * distance

                    )

                );

            }


            const geometry =
                new THREE.BufferGeometry()
                    .setFromPoints(points);


            const material =
                new THREE.LineBasicMaterial({

                    color: 0x29435f,

                    transparent: true,

                    opacity: 0.6

                });


            const orbit =
                new THREE.Line(
                    geometry,
                    material
                );


            scene.add(
                orbit
            );

        }



        /*
         * =====================================================
         * 9. CREATE PLANETS
         * =====================================================
         */


        planetData.forEach((data) => {


            /*
             * First create the planet's orbit.
             */

            createOrbit(
                data.distance
            );


            /*
             * Pivot is an invisible object.
             *
             * We rotate this object to make the
             * planet travel around the Sun.
             */

            const pivot =
                new THREE.Object3D();


            scene.add(
                pivot
            );


            /*
             * Create planet sphere.
             */

            const geometry =
                new THREE.SphereGeometry(

                    data.size,

                    32,

                    32
                );


            const material =
                new THREE.MeshStandardMaterial({

                    color: data.color,

                    roughness: 0.8

                });


            const planet =
                new THREE.Mesh(
                    geometry,
                    material
                );


            /*
             * Move planet away from Sun.
             */

            planet.position.x =
                data.distance;


            /*
             * Store information inside planet.
             */

            planet.userData = data;


            /*
             * Attach planet to its pivot.
             */

            pivot.add(
                planet
            );


            /*
             * Give every planet a different
             * starting position.
             */

            pivot.rotation.y =
                Math.random() *
                Math.PI * 2;



            /*
             * =================================================
             * SATURN RINGS
             * =================================================
             */


            if (
                data.name === "Saturn"
            ) {

                const ringGeometry =
                    new THREE.RingGeometry(

                        data.size * 1.4,

                        data.size * 2.2,

                        64
                    );


                const ringMaterial =
                    new THREE.MeshBasicMaterial({

                        color: 0xcdbb91,

                        side:
                            THREE.DoubleSide,

                        transparent: true,

                        opacity: 0.7

                    });


                const ring =
                    new THREE.Mesh(

                        ringGeometry,

                        ringMaterial

                    );


                ring.rotation.x =
                    Math.PI / 2;


                planet.add(
                    ring
                );

            }



            /*
             * =================================================
             * EARTH'S MOON
             * =================================================
             */


            if (
                data.name === "Earth"
            ) {

                const moon =
                    new THREE.Mesh(

                        new THREE.SphereGeometry(
                            0.35,
                            20,
                            20
                        ),

                        new THREE.MeshStandardMaterial({

                            color:
                                0xaaaaaa

                        })

                    );


                moon.position.x =
                    3.2;


                planet.add(
                    moon
                );

            }



            /*
             * Remember planet and pivot
             * so they can be animated later.
             */

            planets.push({

                planet: planet,

                pivot: pivot,

                speed: data.speed

            });



            /*
             * =================================================
             * CREATE PLANET BUTTON
             * =================================================
             */


            const button =
                document.createElement(
                    "button"
                );


            button.textContent =
                data.name;


            button.onclick =
                function () {

                    focusPlanet(
                        planet
                    );

                };


            document
                .getElementById(
                    "planet-buttons"
                )
                .appendChild(
                    button
                );

        });



        /*
         * =====================================================
         * 10. MOVE CAMERA TO A PLANET
         * =====================================================
         */


        function focusPlanet(planet) {


            /*
             * Get planet's actual position
             * in the 3D world.
             */

            const planetPosition =
                new THREE.Vector3();


            planet.getWorldPosition(
                planetPosition
            );


            /*
             * Tell camera controls:
             *
             * "Look at this planet."
             */

            controls.target.copy(
                planetPosition
            );


            /*
             * Move camera near planet.
             */

            camera.position.copy(
                planetPosition
            );


            camera.position.add(

                new THREE.Vector3(

                    planet.userData.size * 4,

                    planet.userData.size * 2,

                    planet.userData.size * 6

                )

            );


            /*
             * Display planet information.
             */

            const information =
                document.getElementById(
                    "planet-info"
                );


            information.style.display =
                "block";


            information.innerHTML = `

                <h2>
                    ${planet.userData.name}
                </h2>

                <p>
                    Orbit distance in this
                    visualization:
                    ${planet.userData.distance}
                </p>

                <p>
                    Use your mouse to explore
                    around the planet.
                </p>

            `;

        }



        /*
         * =====================================================
         * 11. ALLOW USER TO CLICK PLANETS
         * =====================================================
         */


        const raycaster =
            new THREE.Raycaster();


        const mouse =
            new THREE.Vector2();



        renderer.domElement
            .addEventListener(
                "click",
                function (event) {


                    /*
                     * Convert mouse coordinates into
                     * Three.js coordinates.
                     */

                    mouse.x =
                        (
                            event.clientX /
                            window.innerWidth
                        ) * 2 - 1;


                    mouse.y =
                        -(
                            event.clientY /
                            window.innerHeight
                        ) * 2 + 1;



                    /*
                     * Shoot an invisible ray
                     * from camera through mouse.
                     */

                    raycaster.setFromCamera(

                        mouse,

                        camera

                    );


                    /*
                     * Check if ray hits planet.
                     */

                    const planetMeshes =
                        planets.map(

                            item =>
                                item.planet

                        );


                    const intersections =
                        raycaster.intersectObjects(

                            planetMeshes,

                            false

                        );


                    /*
                     * If planet was clicked...
                     */

                    if (
                        intersections.length > 0
                    ) {

                        focusPlanet(

                            intersections[0]
                                .object

                        );

                    }

                }
            );



        /*
         * =====================================================
         * 12. ANIMATION LOOP
         * =====================================================
         */


        const clock =
            new THREE.Clock();



        function animate() {


            /*
             * Browser calls animate()
             * repeatedly.
             */

            requestAnimationFrame(
                animate
            );


            const delta =
                Math.min(
                    clock.getDelta(),
                    0.03
                );


            /*
             * Rotate the Sun.
             */

            sun.rotation.y +=
                delta * 0.08;



            /*
             * Move every planet.
             */

            planets.forEach(

                function (item) {


                    /*
                     * Rotate pivot.
                     *
                     * This makes the planet
                     * travel around the Sun.
                     */

                    item.pivot.rotation.y +=

                        delta *
                        0.12 *
                        item.speed;



                    /*
                     * Planet itself also rotates.
                     */

                    item.planet.rotation.y +=

                        delta *
                        0.35;

                }

            );


            /*
             * Update camera controls.
             */

            controls.update();


            /*
             * Draw the current scene.
             */

            renderer.render(

                scene,

                camera

            );

        }



        /*
         * Start the animation.
         */

        animate();



        /*
         * =====================================================
         * 13. HANDLE BROWSER RESIZE
         * =====================================================
         */


        window.addEventListener(

            "resize",

            function () {


                camera.aspect =

                    window.innerWidth /
                    window.innerHeight;


                camera
                    .updateProjectionMatrix();


                renderer.setSize(

                    window.innerWidth,

                    window.innerHeight

                );

            }

        );

    </script>

</body>

</html>
