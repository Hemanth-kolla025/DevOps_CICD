<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>3D Solar System Explorer</title>


    <style>

        /* =====================================================
           BASIC PAGE
           ===================================================== */

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000008;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;
        }


        canvas {

            position: fixed;

            top: 0;
            left: 0;

            display: block;

            width: 100%;
            height: 100%;
        }



        /* =====================================================
           LEFT CONTROL PANEL
           ===================================================== */

        #panel {

            position: fixed;

            top: 20px;
            left: 20px;

            width: 330px;

            padding: 20px;

            z-index: 100;

            background:
                rgba(
                    2,
                    13,
                    32,
                    0.82
                );

            backdrop-filter:
                blur(14px);

            border:
                1px solid
                rgba(
                    80,
                    160,
                    255,
                    0.40
                );

            border-radius: 18px;

            box-shadow:
                0 10px 40px
                rgba(
                    0,
                    0,
                    0,
                    0.6
                );
        }


        #panel h1 {

            margin:
                0 0 12px 0;

            color: #78c7ff;

            font-size: 22px;
        }


        .instruction {

            margin: 6px 0;

            color: #c8d7ea;

            font-size: 13px;
        }



        /* =====================================================
           PLANET BUTTONS
           ===================================================== */

        #planetButtons {

            display: flex;

            flex-wrap: wrap;

            gap: 6px;

            margin-top: 15px;
        }


        button {

            padding:
                7px 11px;

            border:

                1px solid
                rgba(
                    100,
                    180,
                    255,
                    0.55
                );

            border-radius:
                20px;

            background:
                rgba(
                    15,
                    45,
                    80,
                    0.85
                );

            color: white;

            cursor: pointer;

            transition:
                all 0.20s;
        }


        button:hover {

            background:
                #1673bb;

            transform:
                translateY(-2px);

            box-shadow:
                0 0 12px
                rgba(
                    0,
                    170,
                    255,
                    0.6
                );
        }



        /* =====================================================
           SPEED CONTROLS
           ===================================================== */

        #simulationControls {

            border-top:
                1px solid
                rgba(
                    100,
                    180,
                    255,
                    0.30
                );

            margin-top:
                15px;

            padding-top:
                12px;
        }


        #speed {

            width: 100%;

            margin:
                10px 0;
        }


        #speedText {

            color:
                #79c9ff;
        }



        /* =====================================================
           RIGHT INFORMATION PANEL
           ===================================================== */

        #planetInfo {

            position: fixed;

            top: 20px;
            right: 20px;

            width: 240px;

            padding: 18px;

            z-index: 100;

            display: none;

            border-radius:
                18px;

            background:
                rgba(
                    2,
                    13,
                    32,
                    0.82
                );

            backdrop-filter:
                blur(14px);

            border:
                1px solid
                rgba(
                    80,
                    160,
                    255,
                    0.40
                );
        }


        #planetInfo h2 {

            color: #78c7ff;

            margin-top: 0;
        }


        #planetInfo p {

            color: #d1dded;

            font-size:
                13px;

            line-height:
                1.5;
        }



        /* =====================================================
           TITLE AT BOTTOM
           ===================================================== */

        #footer {

            position: fixed;

            right: 20px;
            bottom: 15px;

            z-index: 100;

            color:
                #71839d;

            font-size:
                11px;
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (
            max-width: 700px
        ) {

            #panel {

                width:
                    calc(
                        100%
                        - 30px
                    );

                left: 15px;
                top: 15px;

            }


            #planetInfo {

                top: auto;

                right: 15px;
                bottom: 15px;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         USER INTERFACE
         ===================================================== -->


    <div id="panel">


        <h1>

            ☀️ 3D Solar System

        </h1>


        <div class="instruction">

            🖱 Drag → Rotate around Solar System

        </div>


        <div class="instruction">

            🔎 Mouse Wheel → Zoom

        </div>


        <div class="instruction">

            🪐 Click planet or button → Visit

        </div>



        <div id="planetButtons"></div>



        <div id="simulationControls">


            <div>

                ⏱ Speed:
                <span id="speedText">
                    1.0x
                </span>

            </div>


            <input
                id="speed"
                type="range"
                min="0"
                max="5"
                step="0.1"
                value="1"
            >


            <button id="pause">

                ⏸ Pause

            </button>


            <button id="home">

                🌌 Solar System

            </button>


        </div>


    </div>



    <div id="planetInfo"></div>



    <div id="footer">

        Interactive Solar System • Visualization not to scale

    </div>



    <!-- =====================================================
         EVERYTHING BELOW IS JAVASCRIPT
         ===================================================== -->


    <script type="module">


        /*
         * =====================================================
         * LOAD THREE.JS
         * =====================================================
         *
         * We use ONE direct CDN import.
         *
         * No import map.
         * No OrbitControls.
         * No external JavaScript files.
         */


        import * as THREE from
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";



        /*
         * =====================================================
         * SCENE
         * =====================================================
         */


        const scene =
            new THREE.Scene();


        scene.background =
            new THREE.Color(
                0x000008
            );



        /*
         * =====================================================
         * CAMERA
         * =====================================================
         */


        const camera =
            new THREE.PerspectiveCamera(

                60,

                window.innerWidth
                /
                window.innerHeight,

                0.1,

                3000

            );



        /*
         * Camera starts looking
         * down at Solar System.
         */


        camera.position.set(

            0,
            65,
            120

        );



        /*
         * =====================================================
         * RENDERER
         * =====================================================
         */


        const renderer =
            new THREE.WebGLRenderer({

                antialias: true

            });



        renderer.setSize(

            window.innerWidth,

            window.innerHeight

        );



        renderer.setPixelRatio(

            Math.min(

                window.devicePixelRatio,

                2

            )

        );



        document.body.insertBefore(

            renderer.domElement,

            document.body.firstChild

        );



        /*
         * =====================================================
         * CUSTOM CAMERA CONTROLS
         * =====================================================
         *
         * We implement controls ourselves.
         *
         * This removes OrbitControls completely.
         */


        let cameraRadius =
            137;


        let cameraTheta =
            0;


        let cameraPhi =
            1.05;



        const cameraTarget =
            new THREE.Vector3(

                0,
                0,
                0

            );



        let dragging =
            false;


        let previousMouseX =
            0;


        let previousMouseY =
            0;



        function updateCamera() {


            /*
             * Convert spherical coordinates
             * into X/Y/Z position.
             */


            const sinPhi =
                Math.sin(
                    cameraPhi
                );



            camera.position.x =

                cameraTarget.x

                +

                cameraRadius

                *

                sinPhi

                *

                Math.sin(
                    cameraTheta
                );



            camera.position.y =

                cameraTarget.y

                +

                cameraRadius

                *

                Math.cos(
                    cameraPhi
                );



            camera.position.z =

                cameraTarget.z

                +

                cameraRadius

                *

                sinPhi

                *

                Math.cos(
                    cameraTheta
                );



            camera.lookAt(
                cameraTarget
            );

        }



        updateCamera();



        /*
         * Mouse down
         */


        renderer.domElement
            .addEventListener(

                "mousedown",

                function(event) {


                    dragging =
                        true;


                    previousMouseX =
                        event.clientX;


                    previousMouseY =
                        event.clientY;

                }

            );



        /*
         * Mouse released
         */


        window.addEventListener(

            "mouseup",

            function() {


                dragging =
                    false;

            }

        );



        /*
         * Rotate camera
         */


        window.addEventListener(

            "mousemove",

            function(event) {


                if (
                    !dragging
                ) {

                    return;

                }


                const deltaX =

                    event.clientX

                    -

                    previousMouseX;



                const deltaY =

                    event.clientY

                    -

                    previousMouseY;



                cameraTheta -=

                    deltaX
                    *
                    0.005;



                cameraPhi +=

                    deltaY
                    *
                    0.005;



                /*
                 * Prevent camera
                 * flipping upside down.
                 */


                cameraPhi =

                    Math.max(

                        0.12,

                        Math.min(

                            Math.PI
                            -
                            0.12,

                            cameraPhi

                        )

                    );



                previousMouseX =
                    event.clientX;


                previousMouseY =
                    event.clientY;



                updateCamera();

            }

        );



        /*
         * Mouse wheel = zoom.
         */


        renderer.domElement
            .addEventListener(

                "wheel",

                function(event) {


                    event.preventDefault();



                    cameraRadius +=

                        event.deltaY
                        *
                        0.05;



                    cameraRadius =

                        Math.max(

                            4,

                            Math.min(

                                450,

                                cameraRadius

                            )

                        );



                    updateCamera();

                },

                {
                    passive: false
                }

            );



        /*
         * =====================================================
         * STARS
         * =====================================================
         */


        const starGeometry =
            new THREE.BufferGeometry();



        const starPositions =
            [];



        const starColors =
            [];



        for (
            let i = 0;
            i < 7000;
            i++
        ) {


            /*
             * Put stars around
             * the Solar System.
             */


            const radius =

                250

                +

                Math.random()
                *
                900;



            const theta =

                Math.random()
                *
                Math.PI
                *
                2;



            const phi =

                Math.acos(

                    2
                    *
                    Math.random()
                    -
                    1

                );



            starPositions.push(


                radius
                *
                Math.sin(phi)
                *
                Math.cos(theta),


                radius
                *
                Math.cos(phi),


                radius
                *
                Math.sin(phi)
                *
                Math.sin(theta)

            );



            /*
             * Slightly different colors.
             */


            const starType =
                Math.random();



            if (
                starType < 0.15
            ) {

                /*
                 * Blue star
                 */

                starColors.push(

                    0.45,
                    0.65,
                    1

                );

            }

            else if (
                starType < 0.30
            ) {

                /*
                 * Yellow star
                 */

                starColors.push(

                    1,
                    0.85,
                    0.55

                );

            }

            else {

                starColors.push(

                    1,
                    1,
                    1

                );

            }

        }



        starGeometry.setAttribute(

            "position",

            new THREE.Float32BufferAttribute(

                starPositions,

                3

            )

        );



        starGeometry.setAttribute(

            "color",

            new THREE.Float32BufferAttribute(

                starColors,

                3

            )

        );



        const starMaterial =
            new THREE.PointsMaterial({

                size: 1.1,

                vertexColors: true,

                transparent: true,

                opacity: 0.9

            });



        const stars =
            new THREE.Points(

                starGeometry,

                starMaterial

            );



        scene.add(
            stars
        );



        /*
         * =====================================================
         * GALAXY
         * =====================================================
         */


        const galaxyGeometry =
            new THREE.BufferGeometry();


        const galaxyPositions =
            [];


        const galaxyColors =
            [];



        const innerGalaxyColor =
            new THREE.Color(
                0xffcc88
            );


        const outerGalaxyColor =
            new THREE.Color(
                0x3355ff
            );



        const galaxyParticleCount =
            14000;


        const galaxyRadius =
            500;


        const galaxyArms =
            5;



        for (
            let i = 0;
            i < galaxyParticleCount;
            i++
        ) {


            /*
             * More stars toward
             * galaxy centre.
             */


            const radius =

                Math.pow(

                    Math.random(),

                    1.5

                )

                *

                galaxyRadius;



            /*
             * Assign particle
             * to spiral arm.
             */


            const armAngle =

                (

                    i
                    %
                    galaxyArms

                )

                /

                galaxyArms

                *

                Math.PI
                *
                2;



            /*
             * Make arm curve.
             */


            const spin =

                radius
                *
                0.018;



            /*
             * Random spread.
             */


            const randomness =

                (

                    Math.random()
                    -
                    0.5

                )

                *

                (

                    12

                    +

                    radius
                    *
                    0.12

                );



            const x =

                Math.cos(

                    armAngle
                    +
                    spin

                )

                *
                radius

                +

                randomness;



            const z =

                Math.sin(

                    armAngle
                    +
                    spin

                )

                *
                radius

                +

                randomness;



            const y =

                (

                    Math.random()
                    -
                    0.5

                )

                *

                (

                    5

                    +

                    radius
                    *
                    0.035

                );



            galaxyPositions.push(

                x,
                y,
                z

            );



            /*
             * Galaxy colour.
             */


            const color =

                innerGalaxyColor
                    .clone();



            color.lerp(

                outerGalaxyColor,

                radius
                /
                galaxyRadius

            );



            galaxyColors.push(

                color.r,
                color.g,
                color.b

            );

        }



        galaxyGeometry.setAttribute(

            "position",

            new THREE.Float32BufferAttribute(

                galaxyPositions,

                3

            )

        );



        galaxyGeometry.setAttribute(

            "color",

            new THREE.Float32BufferAttribute(

                galaxyColors,

                3

            )

        );



        const galaxyMaterial =
            new THREE.PointsMaterial({

                size: 0.7,

                vertexColors: true,

                transparent: true,

                opacity: 0.38,

                blending:
                    THREE.AdditiveBlending,

                depthWrite: false

            });



        const galaxy =
            new THREE.Points(

                galaxyGeometry,

                galaxyMaterial

            );



        /*
         * Give galaxy slight tilt.
         */


        galaxy.rotation.x =
            0.12;



        scene.add(
            galaxy
        );



        /*
         * =====================================================
         * SUN
         * =====================================================
         */


        const sun =
            new THREE.Mesh(

                new THREE.SphereGeometry(

                    7,

                    48,

                    48

                ),

                new THREE.MeshBasicMaterial({

                    color:
                        0xffaa00

                })

            );



        scene.add(
            sun
        );



        /*
         * =====================================================
         * SUN GLOW
         * =====================================================
         */


        const sunGlow =
            new THREE.Mesh(

                new THREE.SphereGeometry(

                    9,

                    40,

                    40

                ),

                new THREE.MeshBasicMaterial({

                    color:
                        0xff6600,

                    transparent:
                        true,

                    opacity:
                        0.25,

                    blending:
                        THREE.AdditiveBlending,

                    side:
                        THREE.BackSide

                })

            );



        scene.add(
            sunGlow
        );



        const outerSunGlow =
            new THREE.Mesh(

                new THREE.SphereGeometry(

                    12,

                    40,

                    40

                ),

                new THREE.MeshBasicMaterial({

                    color:
                        0xff3300,

                    transparent:
                        true,

                    opacity:
                        0.08,

                    blending:
                        THREE.AdditiveBlending,

                    side:
                        THREE.BackSide

                })

            );



        scene.add(
            outerSunGlow
        );



        /*
         * Sun provides lighting
         * for all planets.
         */


        scene.add(

            new THREE.PointLight(

                0xffffff,

                1100,

                500

            )

        );



        /*
         * Very weak ambient light.
         *
         * Stops back side of planets
         * becoming completely invisible.
         */


        scene.add(

            new THREE.AmbientLight(

                0x35445f,

                0.55

            )

        );



        /*
         * =====================================================
         * PLANET DATA
         * =====================================================
         */


        const planetData = [


            {

                name:
                    "Mercury",

                size:
                    1.0,

                distance:
                    13,

                color:
                    0x999999,

                speed:
                    4.1

            },


            {

                name:
                    "Venus",

                size:
                    1.5,

                distance:
                    19,

                color:
                    0xd9a15c,

                speed:
                    1.6

            },


            {

                name:
                    "Earth",

                size:
                    1.6,

                distance:
                    27,

                color:
                    0x1677dd,

                speed:
                    1

            },


            {

                name:
                    "Mars",

                size:
                    1.25,

                distance:
                    35,

                color:
                    0xd45b36,

                speed:
                    0.53

            },


            {

                name:
                    "Jupiter",

                size:
                    4.2,

                distance:
                    49,

                color:
                    0xd0a47e,

                speed:
                    0.084

            },


            {

                name:
                    "Saturn",

                size:
                    3.6,

                distance:
                    64,

                color:
                    0xd9c288,

                speed:
                    0.034

            },


            {

                name:
                    "Uranus",

                size:
                    2.6,

                distance:
                    78,

                color:
                    0x77dce6,

                speed:
                    0.012

            },


            {

                name:
                    "Neptune",

                size:
                    2.5,

                distance:
                    91,

                color:
                    0x315bd7,

                speed:
                    0.006

            }

        ];



        const planets =
            [];



        /*
         * =====================================================
         * CREATE ORBIT LINE
         * =====================================================
         */


        function createOrbit(
            radius
        ) {


            const points =
                [];


            for (
                let i = 0;
                i <= 180;
                i++
            ) {


                const angle =

                    i
                    /
                    180

                    *

                    Math.PI

                    *
                    2;



                points.push(

                    new THREE.Vector3(

                        Math.cos(angle)
                        *
                        radius,

                        0,

                        Math.sin(angle)
                        *
                        radius

                    )

                );

            }



            const geometry =

                new THREE
                    .BufferGeometry()
                    .setFromPoints(
                        points
                    );



            const line =

                new THREE.Line(

                    geometry,

                    new THREE.LineBasicMaterial({

                        color:
                            0x2d4764,

                        transparent:
                            true,

                        opacity:
                            0.60

                    })

                );



            scene.add(
                line
            );

        }



        /*
         * =====================================================
         * GENERATE PLANETS
         * =====================================================
         */


        planetData.forEach(

            function(data) {


                createOrbit(
                    data.distance
                );



                /*
                 * Pivot goes at Sun.
                 *
                 * Rotating pivot =
                 * orbiting planet.
                 */


                const pivot =
                    new THREE.Object3D();



                scene.add(
                    pivot
                );



                const planet =
                    new THREE.Mesh(

                        new THREE.SphereGeometry(

                            data.size,

                            32,

                            32

                        ),

                        new THREE.MeshStandardMaterial({

                            color:
                                data.color,

                            roughness:
                                0.75

                        })

                    );



                /*
                 * Move planet away
                 * from Sun.
                 */


                planet.position.x =
                    data.distance;



                planet.userData =
                    data;



                pivot.rotation.y =

                    Math.random()

                    *

                    Math.PI

                    *
                    2;



                pivot.add(
                    planet
                );



                /*
                 * =============================================
                 * EARTH FEATURES
                 * =============================================
                 */


                if (
                    data.name
                    ===
                    "Earth"
                ) {


                    /*
                     * Green land-like patches.
                     */


                    const land =
                        new THREE.Mesh(

                            new THREE.SphereGeometry(

                                data.size
                                *
                                1.012,

                                20,

                                20,

                                0,

                                Math.PI
                                *
                                0.7,

                                0.4,

                                Math.PI
                                *
                                0.5

                            ),

                            new THREE.MeshBasicMaterial({

                                color:
                                    0x35a95c,

                                transparent:
                                    true,

                                opacity:
                                    0.8

                            })

                        );



                    planet.add(
                        land
                    );



                    /*
                     * Moon pivot.
                     */


                    const moonPivot =
                        new THREE.Object3D();



                    planet.add(
                        moonPivot
                    );



                    const moon =
                        new THREE.Mesh(

                            new THREE.SphereGeometry(

                                0.40,

                                20,

                                20

                            ),

                            new THREE.MeshStandardMaterial({

                                color:
                                    0xbababa

                            })

                        );



                    moon.position.x =
                        3.5;



                    moonPivot.add(
                        moon
                    );



                    planet.userData
                        .moonPivot =
                            moonPivot;

                }



                /*
                 * =============================================
                 * SATURN RINGS
                 * =============================================
                 */


                if (
                    data.name
                    ===
                    "Saturn"
                ) {


                    const ring =

                        new THREE.Mesh(

                            new THREE.RingGeometry(

                                4.7,

                                7.2,

                                80

                            ),

                            new THREE.MeshBasicMaterial({

                                color:
                                    0xdac999,

                                transparent:
                                    true,

                                opacity:
                                    0.72,

                                side:
                                    THREE.DoubleSide

                            })

                        );



                    ring.rotation.x =

                        Math.PI
                        /
                        2;



                    planet.add(
                        ring
                    );

                }



                planets.push({

                    mesh:
                        planet,

                    pivot:
                        pivot,

                    speed:
                        data.speed

                });



                /*
                 * =============================================
                 * CREATE PLANET BUTTON
                 * =============================================
                 */


                const button =
                    document.createElement(
                        "button"
                    );



                button.textContent =
                    data.name;



                button.addEventListener(

                    "click",

                    function() {


                        focusPlanet(
                            planet
                        );

                    }

                );



                document
                    .getElementById(
                        "planetButtons"
                    )
                    .appendChild(
                        button
                    );

            }

        );



        /*
         * =====================================================
         * ASTEROID BELT
         * =====================================================
         */


        const asteroidGeometry =

            new THREE.IcosahedronGeometry(

                0.14,

                0

            );



        const asteroidMaterial =

            new THREE.MeshStandardMaterial({

                color:
                    0x777777,

                roughness:
                    1

            });



        const asteroidGroup =
            new THREE.Group();



        scene.add(
            asteroidGroup
        );



        for (
            let i = 0;
            i < 450;
            i++
        ) {


            const asteroid =
                new THREE.Mesh(

                    asteroidGeometry,

                    asteroidMaterial

                );



            const angle =

                Math.random()

                *

                Math.PI

                *
                2;



            const radius =

                39

                +

                Math.random()
                *
                5;



            asteroid.position.set(

                Math.cos(angle)
                *
                radius,


                (
                    Math.random()
                    -
                    0.5

                )
                *
                2,


                Math.sin(angle)
                *
                radius

            );



            asteroid.scale.setScalar(

                0.4
                +
                Math.random()
                *
                1.3

            );



            asteroidGroup.add(
                asteroid
            );

        }



        /*
         * =====================================================
         * METEORS
         * =====================================================
         */


        const meteors =
            [];



        function createMeteor() {


            const meteor =
                new THREE.Group();



            /*
             * Meteor head.
             */


            const head =
                new THREE.Mesh(

                    new THREE.SphereGeometry(

                        0.45,

                        12,

                        12

                    ),

                    new THREE.MeshBasicMaterial({

                        color:
                            0xffffff

                    })

                );



            meteor.add(
                head
            );



            /*
             * Create meteor trail
             * using several transparent spheres.
             */


            for (
                let i = 1;
                i <= 14;
                i++
            ) {


                const particle =

                    new THREE.Mesh(

                        new THREE.SphereGeometry(

                            Math.max(

                                0.03,

                                0.32
                                -
                                i
                                *
                                0.02

                            ),

                            8,

                            8

                        ),

                        new THREE.MeshBasicMaterial({

                            color:

                                i < 5

                                ?

                                0x99ddff

                                :

                                0x3377ff,

                            transparent:
                                true,

                            opacity:

                                Math.max(

                                    0.03,

                                    0.65
                                    -
                                    i
                                    *
                                    0.04

                                ),

                            blending:
                                THREE.AdditiveBlending

                        })

                    );



                particle.position.x =

                    -i
                    *
                    0.7;



                meteor.add(
                    particle
                );

            }



            meteor.position.set(

                -150
                -
                Math.random()
                *
                150,


                35
                +
                Math.random()
                *
                100,


                -120
                +
                Math.random()
                *
                240

            );



            meteor.userData.velocity =

                new THREE.Vector3(

                    0.7
                    +
                    Math.random()
                    *
                    0.6,


                    -0.18
                    -
                    Math.random()
                    *
                    0.2,


                    0

                );



            scene.add(
                meteor
            );


            meteors.push(
                meteor
            );

        }



        for (
            let i = 0;
            i < 8;
            i++
        ) {


            createMeteor();

        }



        /*
         * =====================================================
         * CLICK PLANET
         * =====================================================
         */


        const raycaster =
            new THREE.Raycaster();


        const pointer =
            new THREE.Vector2();



        renderer.domElement
            .addEventListener(

                "dblclick",

                function(event) {


                    pointer.x =

                        event.clientX

                        /

                        window.innerWidth

                        *
                        2

                        -
                        1;



                    pointer.y =

                        -(

                            event.clientY

                            /

                            window.innerHeight

                        )

                        *
                        2

                        +
                        1;



                    raycaster.setFromCamera(

                        pointer,

                        camera

                    );



                    const result =

                        raycaster.intersectObjects(

                            planets.map(

                                function(item) {

                                    return item.mesh;

                                }

                            )

                        );



                    if (
                        result.length
                        >
                        0
                    ) {


                        focusPlanet(

                            result[0]
                                .object

                        );

                    }

                }

            );



        /*
         * =====================================================
         * VISIT PLANET
         * =====================================================
         */


        function focusPlanet(
            planet
        ) {


            const worldPosition =
                new THREE.Vector3();



            planet.getWorldPosition(
                worldPosition
            );



            cameraTarget.copy(
                worldPosition
            );



            cameraRadius =

                Math.max(

                    planet.userData.size
                    *
                    7,

                    8

                );



            cameraTheta =
                0.7;


            cameraPhi =
                1.1;



            updateCamera();



            const info =

                document.getElementById(
                    "planetInfo"
                );



            info.style.display =
                "block";



            info.innerHTML = `

                <h2>

                    🪐 ${planet.userData.name}

                </h2>

                <p>

                    You are now visiting
                    <strong>
                        ${planet.userData.name}
                    </strong>.

                </p>

                <p>

                    Drag the mouse to fly
                    around the planet.

                </p>

                <p>

                    Scroll to move closer
                    or farther away.

                </p>

            `;

        }



        /*
         * =====================================================
         * SIMULATION CONTROLS
         * =====================================================
         */


        let simulationSpeed =
            1;


        let paused =
            false;



        const speedSlider =

            document.getElementById(
                "speed"
            );



        speedSlider.addEventListener(

            "input",

            function() {


                simulationSpeed =

                    Number(
                        speedSlider.value
                    );



                document
                    .getElementById(
                        "speedText"
                    )
                    .textContent =

                        simulationSpeed
                        .toFixed(1)

                        +
                        "x";

            }

        );



        document
            .getElementById(
                "pause"
            )
            .addEventListener(

                "click",

                function() {


                    paused =
                        !paused;



                    this.textContent =

                        paused

                        ?

                        "▶ Resume"

                        :

                        "⏸ Pause";

                }

            );



        /*
         * =====================================================
         * HOME BUTTON
         * =====================================================
         */


        document
            .getElementById(
                "home"
            )
            .addEventListener(

                "click",

                function() {


                    cameraTarget.set(

                        0,
                        0,
                        0

                    );


                    cameraRadius =
                        137;


                    cameraTheta =
                        0;


                    cameraPhi =
                        1.05;


                    updateCamera();



                    document
                        .getElementById(
                            "planetInfo"
                        )
                        .style
                        .display =
                            "none";

                }

            );



        /*
         * =====================================================
         * ANIMATION
         * =====================================================
         */


        const clock =
            new THREE.Clock();



        function animate() {


            requestAnimationFrame(
                animate
            );



            const delta =

                Math.min(

                    clock.getDelta(),

                    0.03

                );



            /*
             * Rotate background slowly.
             */


            stars.rotation.y +=

                delta
                *
                0.003;



            galaxy.rotation.y +=

                delta
                *
                0.006;



            /*
             * Pulsating Sun.
             */


            const time =

                performance.now()
                *
                0.001;



            sunGlow.scale.setScalar(

                1

                +

                Math.sin(
                    time
                    *
                    2
                )

                *
                0.035

            );



            outerSunGlow.scale.setScalar(

                1

                +

                Math.sin(
                    time
                )

                *
                0.05

            );



            /*
             * Orbit planets.
             */


            if (
                !paused
            ) {


                planets.forEach(

                    function(item) {


                        item.pivot
                            .rotation
                            .y +=

                                delta

                                *

                                item.speed

                                *

                                0.15

                                *

                                simulationSpeed;



                        item.mesh
                            .rotation
                            .y +=

                                delta

                                *

                                0.35

                                *

                                simulationSpeed;



                        /*
                         * Earth's Moon.
                         */


                        if (

                            item.mesh
                                .userData
                                .moonPivot

                        ) {


                            item.mesh
                                .userData
                                .moonPivot
                                .rotation
                                .y +=

                                    delta

                                    *
                                    1.7

                                    *
                                    simulationSpeed;

                        }

                    }

                );



                asteroidGroup
                    .rotation
                    .y +=

                        delta
                        *
                        0.018
                        *
                        simulationSpeed;

            }



            /*
             * Meteors.
             */


            meteors.forEach(

                function(meteor) {


                    meteor.position.add(

                        meteor.userData
                            .velocity

                    );



                    if (

                        meteor.position.x
                        >
                        200

                        ||

                        meteor.position.y
                        <
                        -100

                    ) {


                        meteor.position.set(

                            -180
                            -
                            Math.random()
                            *
                            100,


                            40
                            +
                            Math.random()
                            *
                            100,


                            -120
                            +
                            Math.random()
                            *
                            240

                        );

                    }

                }

            );



            /*
             * Render final frame.
             */


            renderer.render(

                scene,

                camera

            );

        }



        /*
         * START!
         */


        animate();



        /*
         * =====================================================
         * HANDLE WINDOW RESIZE
         * =====================================================
         */


        window.addEventListener(

            "resize",

            function() {


                camera.aspect =

                    window.innerWidth

                    /

                    window.innerHeight;



                camera
                    .updateProjectionMatrix();



                renderer.setSize(

                    window.innerWidth,

                    window.innerHeight

                );

            }

        );


    </script>


</body>

</html>
