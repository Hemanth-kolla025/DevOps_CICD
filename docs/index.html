<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>3D Solar System Explorer</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {

            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at center,
                    #07152c,
                    #010207 65%
                );

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        canvas {

            display: block;

        }



        /* ===============================
           LEFT CONTROL PANEL
           =============================== */

        #panel {

            position: fixed;

            top: 20px;
            left: 20px;

            width: 340px;

            padding: 18px;

            z-index: 10;

            background:
                rgba(
                    5,
                    15,
                    35,
                    0.72
                );

            border:
                1px solid #31527a;

            border-radius: 16px;

            backdrop-filter:
                blur(12px);

            box-shadow:
                0 0 30px
                rgba(
                    0,
                    120,
                    255,
                    0.15
                );
        }


        #panel h1 {

            margin: 0 0 10px;

            font-size: 21px;

            color: #84ccff;
        }


        #panel p {

            margin: 5px 0;

            color: #c7d6eb;

            font-size: 13px;
        }



        /* ===============================
           PLANET BUTTONS
           =============================== */

        #planet-buttons {

            display: flex;

            flex-wrap: wrap;

            gap: 7px;

            margin-top: 14px;
        }


        button {

            padding: 7px 11px;

            border:
                1px solid #4e78a7;

            border-radius: 20px;

            background:
                #102541;

            color: white;

            cursor: pointer;

            transition:
                0.2s;
        }


        button:hover {

            background:
                #1d568e;

            transform:
                translateY(-2px);

            box-shadow:
                0 0 12px
                rgba(
                    75,
                    170,
                    255,
                    0.5
                );
        }



        /* ===============================
           SPEED CONTROLS
           =============================== */

        #controls {

            margin-top: 15px;

            padding-top: 12px;

            border-top:
                1px solid #31527a;
        }


        #speedControl {

            width: 100%;

            margin:
                8px 0 12px;
        }



        /* ===============================
           PLANET INFORMATION
           =============================== */

        #planet-info {

            position: fixed;

            right: 20px;
            top: 20px;

            width: 240px;

            padding: 18px;

            z-index: 10;

            display: none;

            background:
                rgba(
                    5,
                    15,
                    35,
                    0.78
                );

            border:
                1px solid #31527a;

            border-radius: 16px;

            backdrop-filter:
                blur(12px);

            box-shadow:
                0 0 30px
                rgba(
                    0,
                    120,
                    255,
                    0.15
                );
        }


        #planet-info h2 {

            margin-top: 0;

            color: #84ccff;
        }


        #planet-info p {

            color: #c7d6eb;

            font-size: 13px;

            line-height: 1.5;
        }


        /* Small label */

        #footer {

            position: fixed;

            bottom: 15px;
            right: 20px;

            color: #7187a3;

            font-size: 11px;

            z-index: 10;
        }

    </style>

</head>


<body>


    <!-- ==========================================
         LEFT USER INTERFACE
         ========================================== -->

    <div id="panel">

        <h1>
            ☀️ 3D Solar System
        </h1>


        <p>
            🖱️ Left drag → Rotate
        </p>

        <p>
            🔎 Mouse wheel → Zoom
        </p>

        <p>
            🖱️ Right drag → Pan
        </p>

        <p>
            🪐 Click a planet → Visit it
        </p>


        <div id="planet-buttons"></div>


        <div id="controls">

            <p>
                ⏱ Simulation Speed
            </p>


            <input
                id="speedControl"
                type="range"
                min="0"
                max="5"
                step="0.1"
                value="1"
            >


            <button id="pauseButton">
                ⏸ Pause
            </button>


            <button id="homeButton">
                🌌 Solar System
            </button>

        </div>

    </div>



    <!-- Planet details -->

    <div id="planet-info"></div>


    <div id="footer">

        3D Solar System Learning Model • Not to scale

    </div>



    <!-- ==========================================
         THREE.JS IMPORT
         ========================================== -->

    <script type="importmap">

    {
        "imports": {

            "three":
            "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

            "three/addons/":
            "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
    }

    </script>



    <!-- ==========================================
         JAVASCRIPT
         ========================================== -->

    <script type="module">


        import * as THREE from "three";


        import {

            OrbitControls

        } from

        "three/addons/controls/OrbitControls.js";



        /*
        =========================================================
        1. BASIC THREE.JS SETUP
        =========================================================
        */


        const scene =
            new THREE.Scene();


        scene.fog =
            new THREE.FogExp2(
                0x010207,
                0.0007
            );



        /*
        Camera = user's eyes
        */


        const camera =
            new THREE.PerspectiveCamera(

                55,

                window.innerWidth /
                window.innerHeight,

                0.1,

                3000

            );


        camera.position.set(
            0,
            65,
            125
        );



        /*
        Renderer draws the scene.
        */


        const renderer =
            new THREE.WebGLRenderer({

                antialias: true

            });


        renderer.setSize(

            window.innerWidth,

            window.innerHeight

        );


        renderer.setPixelRatio(

            Math.min(

                window.devicePixelRatio,

                2

            )

        );


        renderer.outputColorSpace =
            THREE.SRGBColorSpace;


        document.body.appendChild(

            renderer.domElement

        );



        /*
        =========================================================
        2. CAMERA CONTROLS
        =========================================================
        */


        const controls =
            new OrbitControls(

                camera,

                renderer.domElement

            );


        controls.enableDamping =
            true;


        controls.dampingFactor =
            0.05;


        controls.minDistance =
            5;


        controls.maxDistance =
            500;



        /*
        =========================================================
        3. STAR FIELD
        =========================================================
        */


        const starPositions = [];


        for (
            let i = 0;
            i < 6000;
            i++
        ) {


            const distance =

                350 +

                Math.random() *
                800;



            const theta =

                Math.random() *

                Math.PI *
                2;



            const phi =

                Math.acos(

                    2 *
                    Math.random()
                    -
                    1

                );



            const x =

                distance *

                Math.sin(phi) *

                Math.cos(theta);



            const y =

                distance *

                Math.cos(phi);



            const z =

                distance *

                Math.sin(phi) *

                Math.sin(theta);



            starPositions.push(

                x,
                y,
                z

            );

        }



        const starGeometry =
            new THREE.BufferGeometry();


        starGeometry.setAttribute(

            "position",

            new THREE.Float32BufferAttribute(

                starPositions,

                3

            )

        );



        const starMaterial =
            new THREE.PointsMaterial({

                color: 0xffffff,

                size: 0.85,

                transparent: true,

                opacity: 0.9

            });



        const stars =
            new THREE.Points(

                starGeometry,

                starMaterial

            );


        scene.add(stars);



        /*
        =========================================================
        4. GALAXY
        =========================================================
        */


        const galaxyPositions = [];

        const galaxyColors = [];


        const galaxyCount =
            18000;


        const galaxyRadius =
            500;


        const galaxyBranches =
            5;



        const insideColor =
            new THREE.Color(
                0xffbb88
            );


        const outsideColor =
            new THREE.Color(
                0x334cff
            );



        for (
            let i = 0;
            i < galaxyCount;
            i++
        ) {


            const radius =

                Math.random() *

                galaxyRadius;



            const branchAngle =

                (

                    i %

                    galaxyBranches

                )

                /

                galaxyBranches

                *

                Math.PI *

                2;



            const spinAngle =

                radius *

                0.025;



            /*
            Randomness makes it look organic.
            */


            const randomX =

                (

                    Math.random()
                    -
                    0.5

                )

                *

                Math.pow(

                    Math.random(),

                    2

                )

                *

                70;



            const randomY =

                (

                    Math.random()
                    -
                    0.5

                )

                *

                18;



            const randomZ =

                (

                    Math.random()
                    -
                    0.5

                )

                *

                Math.pow(

                    Math.random(),

                    2

                )

                *

                70;



            const x =

                Math.cos(

                    branchAngle
                    +
                    spinAngle

                )

                *

                radius

                +

                randomX;



            const y =
                randomY;



            const z =

                Math.sin(

                    branchAngle
                    +
                    spinAngle

                )

                *

                radius

                +

                randomZ;



            galaxyPositions.push(

                x,
                y,
                z

            );



            /*
            Galaxy changes from warm color
            near center to blue outside.
            */


            const color =

                insideColor.clone();



            color.lerp(

                outsideColor,

                radius /
                galaxyRadius

            );



            galaxyColors.push(

                color.r,

                color.g,

                color.b

            );

        }



        const galaxyGeometry =
            new THREE.BufferGeometry();



        galaxyGeometry.setAttribute(

            "position",

            new THREE.Float32BufferAttribute(

                galaxyPositions,

                3

            )

        );



        galaxyGeometry.setAttribute(

            "color",

            new THREE.Float32BufferAttribute(

                galaxyColors,

                3

            )

        );



        const galaxyMaterial =
            new THREE.PointsMaterial({

                size: 1.25,

                vertexColors: true,

                transparent: true,

                opacity: 0.65,

                blending:
                    THREE.AdditiveBlending,

                depthWrite: false

            });



        const galaxy =
            new THREE.Points(

                galaxyGeometry,

                galaxyMaterial

            );



        galaxy.rotation.x =
            Math.PI *
            0.08;



        scene.add(
            galaxy
        );



        /*
        =========================================================
        5. SPACE DUST
        =========================================================
        */


        const dustPositions = [];


        for (
            let i = 0;
            i < 3000;
            i++
        ) {


            dustPositions.push(

                (
                    Math.random()
                    -
                    0.5

                ) * 500,


                (
                    Math.random()
                    -
                    0.5

                ) * 200,


                (
                    Math.random()
                    -
                    0.5

                ) * 500

            );

        }



        const dustGeometry =
            new THREE.BufferGeometry();


        dustGeometry.setAttribute(

            "position",

            new THREE.Float32BufferAttribute(

                dustPositions,

                3

            )

        );



        const dustMaterial =
            new THREE.PointsMaterial({

                color: 0x7098cc,

                size: 0.16,

                transparent: true,

                opacity: 0.4

            });



        const spaceDust =
            new THREE.Points(

                dustGeometry,

                dustMaterial

            );


        scene.add(
            spaceDust
        );



        /*
        =========================================================
        6. LIGHT
        =========================================================
        */


        scene.add(

            new THREE.AmbientLight(

                0x304060,

                0.55

            )

        );



        /*
        =========================================================
        7. SUN
        =========================================================
        */


        const sun =
            new THREE.Mesh(

                new THREE.SphereGeometry(

                    7,
                    48,
                    48

                ),

                new THREE.MeshBasicMaterial({

                    color:
                        0xffaa22

                })

            );


        scene.add(
            sun
        );



        /*
        Sun light illuminates planets.
        */


        const sunLight =
            new THREE.PointLight(

                0xffffff,

                1000,

                700

            );


        scene.add(
            sunLight
        );



        /*
        =========================================================
        8. SUN GLOW EFFECT
        =========================================================
        */


        const glow1 =
            new THREE.Mesh(

                new THREE.SphereGeometry(

                    8.5,
                    32,
                    32

                ),

                new THREE.MeshBasicMaterial({

                    color:
                        0xff8800,

                    transparent:
                        true,

                    opacity:
                        0.22,

                    blending:
                        THREE.AdditiveBlending,

                    side:
                        THREE.BackSide

                })

            );



        scene.add(
            glow1
        );



        const glow2 =
            new THREE.Mesh(

                new THREE.SphereGeometry(

                    11,
                    32,
                    32

                ),

                new THREE.MeshBasicMaterial({

                    color:
                        0xff4400,

                    transparent:
                        true,

                    opacity:
                        0.10,

                    blending:
                        THREE.AdditiveBlending,

                    side:
                        THREE.BackSide

                })

            );



        scene.add(
            glow2
        );



        /*
        =========================================================
        9. PLANET DATA
        =========================================================
        */


        const planetData = [


            {
                name:
                    "Mercury",

                size:
                    0.8,

                distance:
                    12,

                color:
                    0x9b938c,

                speed:
                    4.15
            },


            {
                name:
                    "Venus",

                size:
                    1.3,

                distance:
                    18,

                color:
                    0xd9a05b,

                speed:
                    1.62
            },


            {
                name:
                    "Earth",

                size:
                    1.45,

                distance:
                    25,

                color:
                    0x2874d8,

                speed:
                    1
            },


            {
                name:
                    "Mars",

                size:
                    1.05,

                distance:
                    32,

                color:
                    0xc85b35,

                speed:
                    0.53
            },


            {
                name:
                    "Jupiter",

                size:
                    3.7,

                distance:
                    44,

                color:
                    0xcfa47e,

                speed:
                    0.084
            },


            {
                name:
                    "Saturn",

                size:
                    3.1,

                distance:
                    57,

                color:
                    0xdac58d,

                speed:
                    0.034
            },


            {
                name:
                    "Uranus",

                size:
                    2.2,

                distance:
                    69,

                color:
                    0x80dce5,

                speed:
                    0.012
            },


            {
                name:
                    "Neptune",

                size:
                    2.2,

                distance:
                    80,

                color:
                    0x3158d4,

                speed:
                    0.006
            }

        ];



        const planets = [];



        /*
        =========================================================
        10. CREATE ORBIT
        =========================================================
        */


        function createOrbit(
            distance
        ) {


            const points = [];


            for (
                let i = 0;
                i <= 150;
                i++
            ) {


                const angle =

                    (

                        i /
                        150

                    )

                    *

                    Math.PI *

                    2;



                points.push(

                    new THREE.Vector3(

                        Math.cos(angle)
                        *
                        distance,

                        0,

                        Math.sin(angle)
                        *
                        distance

                    )

                );

            }



            const geometry =

                new THREE
                    .BufferGeometry()
                    .setFromPoints(
                        points
                    );



            const material =

                new THREE.LineBasicMaterial({

                    color:
                        0x31547a,

                    transparent:
                        true,

                    opacity:
                        0.45

                });



            const orbit =

                new THREE.Line(

                    geometry,

                    material

                );



            scene.add(
                orbit
            );

        }



        /*
        =========================================================
        11. CREATE ALL PLANETS
        =========================================================
        */


        planetData.forEach(

            function (data) {


                createOrbit(
                    data.distance
                );



                /*
                PIVOT

                Sun
                 │
                 └── Pivot
                       │
                       └── Planet

                Rotating the pivot makes
                the planet orbit the Sun.
                */


                const pivot =
                    new THREE.Object3D();



                scene.add(
                    pivot
                );



                const geometry =

                    new THREE.SphereGeometry(

                        data.size,

                        32,

                        32

                    );



                const material =

                    new THREE.MeshStandardMaterial({

                        color:
                            data.color,

                        roughness:
                            0.75,

                        metalness:
                            0.05

                    });



                const planet =

                    new THREE.Mesh(

                        geometry,

                        material

                    );



                planet.position.x =

                    data.distance;



                planet.userData =

                    data;



                pivot.rotation.y =

                    Math.random()

                    *

                    Math.PI

                    *

                    2;



                pivot.add(
                    planet
                );



                /*
                ==========================
                SATURN RINGS
                ==========================
                */


                if (
                    data.name
                    ===
                    "Saturn"
                ) {


                    const rings =

                        new THREE.Mesh(

                            new THREE.RingGeometry(

                                data.size
                                *
                                1.4,

                                data.size
                                *
                                2.3,

                                80

                            ),

                            new THREE.MeshBasicMaterial({

                                color:
                                    0xd2be92,

                                transparent:
                                    true,

                                opacity:
                                    0.7,

                                side:
                                    THREE.DoubleSide

                            })

                        );



                    rings.rotation.x =

                        Math.PI
                        /
                        2;



                    planet.add(
                        rings
                    );

                }



                /*
                ==========================
                EARTH MOON
                ==========================
                */


                if (
                    data.name
                    ===
                    "Earth"
                ) {


                    const moonPivot =

                        new THREE.Object3D();



                    planet.add(
                        moonPivot
                    );



                    const moon =

                        new THREE.Mesh(

                            new THREE.SphereGeometry(

                                0.36,

                                20,

                                20

                            ),

                            new THREE.MeshStandardMaterial({

                                color:
                                    0xaaaaaa,

                                roughness:
                                    1

                            })

                        );



                    moon.position.x =
                        3.2;



                    moonPivot.add(
                        moon
                    );



                    planet.userData.moonPivot =

                        moonPivot;

                }



                planets.push({

                    planet:

                        planet,

                    pivot:

                        pivot,

                    speed:

                        data.speed

                });



                /*
                ==========================
                CREATE HTML BUTTON
                ==========================
                */


                const button =

                    document.createElement(

                        "button"

                    );



                button.textContent =

                    data.name;



                button.onclick =

                    function () {


                        focusPlanet(
                            planet
                        );

                    };



                document
                    .getElementById(
                        "planet-buttons"
                    )
                    .appendChild(
                        button
                    );

            }

        );



        /*
        =========================================================
        12. ASTEROID BELT
        =========================================================
        */


        const asteroidGeometry =

            new THREE.IcosahedronGeometry(

                0.15,

                0

            );



        const asteroidMaterial =

            new THREE.MeshStandardMaterial({

                color:
                    0x777777,

                roughness:
                    1

            });



        for (
            let i = 0;
            i < 700;
            i++
        ) {


            const asteroid =

                new THREE.Mesh(

                    asteroidGeometry,

                    asteroidMaterial

                );



            const angle =

                Math.random()
                *
                Math.PI
                *
                2;



            const distance =

                35 +

                Math.random()
                *
                5;



            asteroid.position.set(

                Math.cos(angle)
                *
                distance,


                (
                    Math.random()
                    -
                    0.5

                )
                *
                2,


                Math.sin(angle)
                *
                distance

            );



            const scale =

                0.4 +

                Math.random();



            asteroid.scale.setScalar(
                scale
            );



            scene.add(
                asteroid
            );

        }



        /*
        =========================================================
        13. METEORS
        =========================================================
        */


        const meteors = [];



        function createMeteor() {


            const meteorGroup =

                new THREE.Group();



            /*
            Bright meteor head.
            */


            const head =

                new THREE.Mesh(

                    new THREE.SphereGeometry(

                        0.35,

                        12,

                        12

                    ),

                    new THREE.MeshBasicMaterial({

                        color:
                            0xffffff

                    })

                );



            meteorGroup.add(
                head
            );



            /*
            Blue glowing trail.
            */


            const trail =

                new THREE.Mesh(

                    new THREE.CylinderGeometry(

                        0.03,

                        0.30,

                        12,

                        8

                    ),

                    new THREE.MeshBasicMaterial({

                        color:
                            0x66ccff,

                        transparent:
                            true,

                        opacity:
                            0.65,

                        blending:
                            THREE.AdditiveBlending

                    })

                );



            /*
            Cylinder normally points vertically.

            Rotate it sideways.
            */


            trail.rotation.z =

                Math.PI
                /
                2;



            trail.position.x =

                -6;



            meteorGroup.add(
                trail
            );



            /*
            Random starting position.
            */


            meteorGroup.position.set(

                -180
                -
                Math.random()
                *
                150,


                30
                +
                Math.random()
                *
                100,


                -120
                +
                Math.random()
                *
                240

            );



            meteorGroup.userData.velocity =

                new THREE.Vector3(

                    1.3
                    +
                    Math.random()
                    *
                    2,


                    -0.25
                    -
                    Math.random()
                    *
                    0.5,


                    (
                        Math.random()
                        -
                        0.5
                    )
                    *
                    0.3

                );



            scene.add(
                meteorGroup
            );


            meteors.push(
                meteorGroup
            );

        }



        /*
        Create multiple meteors.
        */


        for (
            let i = 0;
            i < 10;
            i++
        ) {


            createMeteor();

        }



        /*
        =========================================================
        14. CLICK PLANETS
        =========================================================
        */


        const raycaster =

            new THREE.Raycaster();



        const mouse =

            new THREE.Vector2();



        renderer.domElement
            .addEventListener(

                "click",

                function (event) {


                    mouse.x =

                        (

                            event.clientX

                            /

                            window.innerWidth

                        )

                        *
                        2

                        -
                        1;



                    mouse.y =

                        -(

                            event.clientY

                            /

                            window.innerHeight

                        )

                        *
                        2

                        +
                        1;



                    raycaster.setFromCamera(

                        mouse,

                        camera

                    );



                    const planetMeshes =

                        planets.map(

                            item =>
                                item.planet

                        );



                    const intersections =

                        raycaster
                            .intersectObjects(

                                planetMeshes,

                                false

                            );



                    if (
                        intersections.length
                        >
                        0
                    ) {


                        focusPlanet(

                            intersections[0]
                                .object

                        );

                    }

                }

            );



        /*
        =========================================================
        15. FOCUS CAMERA ON PLANET
        =========================================================
        */


        function focusPlanet(
            planet
        ) {


            const position =

                new THREE.Vector3();



            planet.getWorldPosition(
                position
            );



            controls.target.copy(
                position
            );



            camera.position.copy(
                position
            );



            const distance =

                Math.max(

                    planet.userData.size
                    *
                    6,

                    8

                );



            camera.position.add(

                new THREE.Vector3(

                    distance,

                    distance
                    *
                    0.5,

                    distance

                )

            );



            const info =

                document
                    .getElementById(
                        "planet-info"
                    );



            info.style.display =
                "block";



            info.innerHTML = `

                <h2>
